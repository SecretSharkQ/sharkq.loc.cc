<style>
:root{--bg:#000000;--glow:#1b1b1d;--card:#0d0d0f;--line:#2c2c2e;--tx:#f5f5f7;--mut:#86868b;--ac:#2997ff;--hover:#1a1a1c;--chipbg:rgba(255,255,255,.06);--btnr:999px;--ring:linear-gradient(135deg,#f5f5f7,#48484a);--ringglow:rgba(255,255,255,.25);--shade:rgba(0,0,0,.7)}
html[data-theme=light]{--bg:#f5f5f7;--glow:#e8e8ed;--card:#ffffff;--line:#d2d2d7;--tx:#1d1d1f;--mut:#6e6e73;--ac:#0071e3;--hover:#eeeef0;--chipbg:rgba(0,0,0,.04);--btnr:999px;--ring:linear-gradient(135deg,#0071e3,#42a5f5);--ringglow:rgba(0,113,227,.2);--shade:rgba(0,0,0,.35)}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%}
body{background:radial-gradient(1200px 700px at 50% -10%,var(--glow) 0%,var(--bg) 55%) no-repeat fixed;background-color:var(--bg);color:var(--tx);font-family:'Segoe UI',system-ui,-apple-system,sans-serif;line-height:1.5;-webkit-font-smoothing:antialiased;display:flex;align-items:center;justify-content:center;padding:28px 16px;transition:background-color .4s ease,color .4s ease;-webkit-user-select:none;user-select:none}
.sheet,.langbtn,.themebtn,.qr-go{transition:background-color .4s ease,color .4s ease,border-color .4s ease}
.card{width:100%;max-width:360px;text-align:center;position:relative;z-index:1;animation:rise .55s ease-out both}
#snow{position:fixed;inset:0;z-index:0;pointer-events:none}
.snowbtn{position:absolute;top:42px;right:-4px;width:40px;height:40px;border-radius:50%;border:1px solid var(--line);background:var(--card);color:var(--mut);cursor:pointer;display:flex;align-items:center;justify-content:center;transition:background-color .4s ease,color .4s ease,border-color .4s ease}
.snowbtn svg{display:block}
.snowbtn.on{color:#9fd8ff;border-color:rgba(159,216,255,.4)}
@keyframes rise{from{opacity:0;transform:translateY(16px)}to{opacity:1;transform:none}}
@media(prefers-reduced-motion:reduce){.card{animation:none}}
.themebtn{position:absolute;top:-4px;right:-4px;width:40px;height:40px;border-radius:50%;border:1px solid var(--line);background:var(--card);color:var(--mut);cursor:pointer;display:flex;align-items:center;justify-content:center}
.themebtn svg{display:block}
.langwrap{position:absolute;top:-4px;right:44px}
.langbtn{height:40px;min-width:40px;padding:0 12px;border-radius:20px;border:1px solid var(--line);background:var(--card);color:var(--mut);cursor:pointer;font-size:12px;font-weight:500;font-family:'Consolas',monospace}
.langbtn:hover,.themebtn:hover{color:var(--tx)}
.langmenu{position:absolute;top:46px;right:0;min-width:160px;background:var(--card);border:1px solid var(--line);border-radius:14px;padding:6px;opacity:0;visibility:hidden;transform:translateY(-8px) scale(.95);transform-origin:top right;transition:opacity .22s ease,transform .22s ease,visibility .22s;z-index:100;box-shadow:0 12px 34px rgba(0,0,0,.4)}
.langmenu.open{opacity:1;visibility:visible;transform:none}
.langmenu button{display:flex;width:100%;align-items:center;justify-content:space-between;gap:10px;padding:8px 12px;border:none;background:none;color:var(--tx);font-size:13px;border-radius:9px;cursor:pointer;font-family:inherit;transition:background .15s}
.langmenu button:hover{background:var(--hover)}
.langmenu button.act{color:var(--ac);font-weight:600}
.langmenu button.act::after{content:'✓'}
html .themebtn .sun{display:block}
html .themebtn .moon{display:none}
html[data-theme=light] .themebtn .sun{display:none}
html[data-theme=light] .themebtn .moon{display:block}
.ava{width:112px;height:112px;border-radius:50%;margin:0 auto 18px;display:block;padding:3px;background:var(--ring);box-shadow:0 0 34px var(--ringglow)}
.ava img{width:100%;height:100%;border-radius:50%;display:block;object-fit:cover;background:#1c2937}
h1{font-size:26px;font-weight:600;letter-spacing:.2px}
.user{position:relative;display:inline-flex;align-items:center;gap:6px;margin:8px auto 26px;padding:5px 14px;border:1px solid var(--line);border-radius:999px;background:var(--chipbg);color:var(--ac);text-decoration:none;font-size:14px;user-select:none;-webkit-user-select:none;cursor:pointer;transition:background .2s}
.user:hover{background:rgba(42,171,238,.08)}
@keyframes pop{0%{transform:scale(.82)}55%{transform:scale(1.08)}100%{transform:scale(1)}}
.user.copied{background:var(--ac);border-color:var(--ac);color:#fff;animation:pop .45s cubic-bezier(.2,1.4,.4,1) both}
@keyframes ripple{from{opacity:.75;transform:scale(1)}to{opacity:0;transform:scale(1.55)}}
.user.rippling::after{content:'';position:absolute;inset:-1px;border-radius:999px;border:2px solid var(--ac);animation:ripple .55s ease-out forwards;pointer-events:none}
::view-transition-old(root),::view-transition-new(root){animation:none;mix-blend-mode:normal}
.links{display:flex;flex-direction:column;gap:11px}
.btn{display:flex;align-items:center;gap:13px;padding:14px 18px;border-radius:var(--btnr);background:var(--card);border:1px solid var(--line);color:var(--tx);text-decoration:none;font-size:15px;font-weight:500;transition:transform .12s ease,box-shadow .12s ease,background-color .4s ease,color .4s ease,border-color .4s ease}
.btn .txt{flex:1;text-align:center}
.btn:hover{transform:translateY(-1px)}
.btn.tg{background:linear-gradient(135deg,#2aabee,#1c86c6);border-color:rgba(42,171,238,.4);color:#fff}
.btn.tg:hover{box-shadow:0 8px 26px rgba(42,171,238,.35)}
.btn.gh{background:linear-gradient(135deg,#24292f,#0d1117);border-color:#30363d;color:#fff}
.btn.gh:hover{box-shadow:0 8px 26px rgba(36,41,47,.6)}
.btn .ic{width:38px;height:38px;border-radius:11px;display:flex;align-items:center;justify-content:center;flex:none;color:#fff}
.btn .ic svg{display:block}
.btn small{display:block;color:var(--mut);font-size:12px;font-weight:400;margin-top:1px}
.btn.tg small,.btn.gh small{color:rgba(255,255,255,.72)}
.ic-tg{background:rgba(255,255,255,.16)}
.ic-gh{background:rgba(255,255,255,.14)}
.btn .arrow{margin-left:auto;color:var(--mut)}
.modal{position:fixed;inset:0;background:rgba(5,12,20,.55);display:flex;align-items:center;justify-content:center;padding:20px;opacity:0;pointer-events:none;transition:opacity .2s;z-index:10}
.modal.show{opacity:1;pointer-events:auto}
.sheet{background:var(--card);border:1px solid var(--line);border-radius:20px;padding:22px;max-width:300px;width:100%;text-align:center;transform:scale(.94);transition:transform .2s}
.modal.show .sheet{transform:scale(1)}
.sheet b{font-size:16px}
.qrbox{background:#fff;border-radius:14px;padding:14px;margin:14px auto;width:200px}
.qrbox svg{display:block;width:100%;height:auto;shape-rendering:crispEdges}
.qrhint{color:var(--ac);font-size:14px;margin-bottom:14px}
.qr-go{display:block;background:linear-gradient(135deg,#2aabee,#1c86c6);color:#fff;text-decoration:none;font-weight:600;padding:12px;border-radius:var(--btnr);font-size:15px}
.qr-x{background:none;border:none;color:var(--mut);font-size:13px;padding:10px 6px 0;cursor:pointer;font-family:inherit}
.qr-x:hover{color:var(--tx)}
.foot{margin-top:26px;color:var(--mut);font-size:12px;font-family:'Consolas','Courier New',monospace;min-height:18px;letter-spacing:.5px}
.foot .dud{opacity:.4}
/* shimmer name */
#pname{position:relative;font-weight:700;filter:drop-shadow(0 0 22px rgba(255,110,160,.22))}
#pname::before{content:attr(data-text);position:absolute;top:3px;left:0;width:100%;color:rgba(0,0,0,.9);text-shadow:0 1px 2px rgba(0,0,0,.55),0 4px 10px rgba(0,0,0,.5),0 10px 28px rgba(0,0,0,.55);z-index:0;pointer-events:none}
.pname-t{position:relative;z-index:1;background:linear-gradient(90deg,#ff5ea8,#ff9e57,#57c7ff,#b06bff,#ff5ea8);background-size:300% 100%;-webkit-background-clip:text;background-clip:text;-webkit-text-fill-color:transparent;animation:nameflow 9s linear infinite}
@keyframes nameflow{0%{background-position:0% 0}100%{background-position:-300% 0}}
/* garland: cable + hanging bulbs */
.garland{position:fixed;top:-2px;left:-10px;right:-10px;height:60px;z-index:9;pointer-events:none;overflow:visible;transition:opacity .5s ease}
.garland svg{position:absolute;top:0;left:0;width:100%;height:100%;overflow:visible}
.garland .bulb{display:block;position:absolute;width:12px;transform-origin:50% 0;animation:gswing var(--sd,3.4s) ease-in-out infinite alternate;animation-delay:var(--bd,0s)}
.garland .cap{display:block;width:6px;height:7px;margin:0 auto;border-radius:2px;background:linear-gradient(180deg,#3a3a40,#151518);box-shadow:0 1px 2px rgba(0,0,0,.55)}
.garland .glass{display:block;width:10px;height:13px;margin:-1px auto 0;border-radius:50%/58% 58% 42% 42%;background:radial-gradient(circle at 30% 26%,rgba(255,255,255,.9) 0 7%,rgba(255,255,255,0) 40%),var(--c);box-shadow:0 0 8px 2px var(--c);animation:gtwinkle var(--td,2.6s) ease-in-out infinite;animation-delay:var(--bd,0s)}
@supports (color: color-mix(in srgb, red 50%, blue)){
  .garland .glass{box-shadow:0 0 8px 2px var(--c),0 0 22px 7px color-mix(in srgb,var(--c) 55%,transparent)}
}
@keyframes gswing{from{transform:rotate(-6deg)}to{transform:rotate(6deg)}}
@keyframes gtwinkle{0%,100%{filter:brightness(1.12)}50%{filter:brightness(.55)}}
html[data-theme=light] .garland .glass{box-shadow:0 0 6px 1px var(--c)}
/* countdown */
#nyd{color:var(--ac);font-family:'Consolas','Courier New',monospace;font-size:12px;letter-spacing:1.5px;font-variant-numeric:tabular-nums;margin-bottom:3px;transition:opacity .5s ease}
@media(prefers-reduced-motion:reduce){#pname,#pname .pname-t{animation:none}.pname-t::before,.garland i,.garland i *{animation:none!important}}
@media(max-width:380px){.ava{width:96px;height:96px}h1{font-size:23px}.langwrap{right:38px}.langbtn{padding:0 8px}#nyd{font-size:11px;letter-spacing:1px}}
</style>

    ru: {tg:'Telegram', 'tg-s':'написать в личку', 'gh-s':'код и проекты', scan:'Сканируй или жми', go:'Перейти в Telegram', close:'Закрыть', copied:'скопировано ✓'},
    en: {tg:'Telegram', 'tg-s':'write me privately', 'gh-s':'code & projects', scan:'Scan or tap', go:'Open Telegram', close:'Close', copied:'copied ✓'},
    uk: {tg:'Telegram', 'tg-s':'написати в особисті', 'gh-s':'код і проєкти', scan:'Скануй або тисни', go:'Перейти в Telegram', close:'Закрити', copied:'скопійовано ✓'},
    pl: {tg:'Telegram', 'tg-s':'napisz prywatnie', 'gh-s':'kod i projekty', scan:'Zeskanuj lub kliknij', go:'Otwórz Telegram', close:'Zamknij', copied:'skopiowano ✓'},
    be: {tg:'Telegram', 'tg-s':'напісаць у асабістыя', 'gh-s':'код і праекты', scan:'Скануй ці націсні', go:'Перайсці ў Telegram', close:'Закрыць', copied:'скапіявана ✓'}
  };
  var lang = 'ru';
  try { lang = localStorage.getItem('shq-lang') || 'ru'; } catch(e) {}

  // clean junk hash from url
  if (location.hash) { try { history.replaceState(null, '', location.pathname + location.search); } catch(e) {} }

  // dynamic telegram name + avatar (refresh every minute)
  var pname = document.getElementById('pname');
  var avaImg = document.querySelector('.ava img');
  function applyName(n){
    if (n) {
      var st = pname.querySelector('.pname-t') || pname;
      st.textContent = n;
      pname.setAttribute('data-text', n);
      try { localStorage.setItem('shq-name', n); } catch(e) {}
    }
  }
  function pullName(){
    fetch('name.json?t=' + Date.now()).then(function(r){
      return r.ok ? r.json() : Promise.reject();
    }).then(function(d){
      applyName(d.name);
      applyAvatarVer(d.ava);
    }).catch(function(){
      fetch('https://r.jina.ai/https://t.me/secretsharkq').then(function(r){
        return r.ok ? r.text() : Promise.reject();
      }).then(function(t){
        var m = t.match(/^Title:\s*(.+)$/m);
        var nm = m && m[1] ? m[1].trim() : '';
        if (nm && nm.indexOf('Telegram') !== 0) applyName(nm);
      }).catch(function(){});
    });
  }
  var avaVer = 0;
  function applyAvatarVer(v){
    if (v && String(v) !== String(avaVer)){
      avaVer = v;
      avaImg.src = 'avatar.jpg?v=' + v;
    }
  }
  pullName();
  setInterval(pullName, 60000);

  // theme (circle reveal from button; manual wipe fallback for http)
  var tb = document.getElementById('tbtn');
  function circleWipe(apply, toLight){
    var r = tb.getBoundingClientRect();
    var x = r.left + r.width / 2, y = r.top + r.height / 2;
    var maxR = Math.hypot(Math.max(x, window.innerWidth - x), Math.max(y, window.innerHeight - y));
    var o = document.createElement('div');
    o.style.cssText = 'position:fixed;inset:0;z-index:9999;pointer-events:none;background:' +
      (toLight ? '#f5f5f7' : '#000000') + ';clip-path:circle(0px at ' + x + 'px ' + y + 'px);' +
      'transition:clip-path .45s ease-in-out;will-change:clip-path';
    document.body.appendChild(o);
    var finished = false;
    function fin(){
      if (finished) return;
      finished = true;
      apply();
      o.style.transition = 'opacity .35s ease-out';
      o.style.opacity = '0';
      setTimeout(function(){ if (o.parentNode) o.parentNode.removeChild(o); }, 420);
    }
    o.addEventListener('transitionend', fin, {once: true});
    setTimeout(function(){ o.style.clipPath = 'circle(' + maxR + 'px at ' + x + 'px ' + y + 'px)'; }, 30);
    setTimeout(fin, 800);
  }
  tb.addEventListener('click', function(){
    var d = document.documentElement;
    var toLight = d.dataset.theme !== 'light';
    var apply = function(){
      d.dataset.theme = toLight ? 'light' : 'dark';
      try { localStorage.setItem('shq-theme', toLight ? 'light' : 'dark'); } catch(e) {}
      if (typeof updateSnow === 'function') updateSnow();
    };
    var reduced = window.matchMedia('(prefers-reduced-motion: reduce)').matches;
    if (document.startViewTransition && !reduced) {
      var r = tb.getBoundingClientRect();
      var x = r.left + r.width / 2, y = r.top + r.height / 2;
      var maxR = Math.hypot(Math.max(x, window.innerWidth - x), Math.max(y, window.innerHeight - y));
      var vt = document.startViewTransition(apply);
      vt.ready.then(function(){
        document.documentElement.animate(
          { clipPath: ['circle(0px at ' + x + 'px ' + y + 'px)', 'circle(' + maxR + 'px at ' + x + 'px ' + y + 'px)'] },
          { duration: 650, easing: 'ease-in-out', pseudoElement: '::view-transition-new(root)' }
        );
      }).catch(function(){});
    } else if (!reduced) {
      circleWipe(apply, toLight);
    } else apply();
  });

  // language (dropdown + swap animation)
  var lb = document.getElementById('langbtn');
  var langmenu = document.getElementById('langmenu');
  function applyLang(animate){
    var els = document.querySelectorAll('[data-i18n],[data-i18n-ph]');
    var touched = [];
    for (var i = 0; i < els.length; i++) {
      var k = els[i].dataset.i18n;
      if (k && I18N[lang][k]) { els[i].textContent = I18N[lang][k]; touched.push(els[i]); }
      var pk = els[i].dataset.i18nPh;
      if (pk && I18N[lang][pk]) els[i].placeholder = I18N[lang][pk];
    }
    document.documentElement.lang = lang;
    lb.textContent = lang.toUpperCase();
    var opts = langmenu.querySelectorAll('button');
    for (var j = 0; j < opts.length; j++) opts[j].classList.toggle('act', opts[j].dataset.lang === lang);
    if (animate && !window.matchMedia('(prefers-reduced-motion: reduce)').matches) {
      for (var m = 0; m < touched.length; m++) {
        (function(el, d){
          el.animate(
            [{opacity: 0, transform: 'translateY(9px)'},
             {opacity: 1, transform: 'none'}],
            {duration: 340, delay: d * 45, easing: 'cubic-bezier(.2,.8,.3,1)', fill: 'backwards'});
        })(touched[m], m);
      }
    }
  }
  lb.addEventListener('click', function(e){
    e.stopPropagation();
    langmenu.classList.toggle('open');
    langmenu.setAttribute('aria-hidden', String(!langmenu.classList.contains('open')));
  });
  var mopts = langmenu.querySelectorAll('button');
  for (var mi = 0; mi < mopts.length; mi++) {
    (function(btn){
      btn.addEventListener('click', function(){
        lang = btn.dataset.lang;
        try { localStorage.setItem('shq-lang', lang); } catch(e) {}
        applyLang(true);
        langmenu.classList.remove('open');
        langmenu.setAttribute('aria-hidden', 'true');
      });
    })(mopts[mi]);
  }
  document.addEventListener('click', function(e){
    if (!langmenu.contains(e.target) && !lb.contains(e.target)) {
      langmenu.classList.remove('open');
      langmenu.setAttribute('aria-hidden', 'true');
    }
  });
  applyLang(false);

  // copy util (with http fallback)
  function copyText(t, cb){
    if (navigator.clipboard && window.isSecureContext) {
      navigator.clipboard.writeText(t).then(cb, function(){ legacyCopy(t, cb); });
    } else legacyCopy(t, cb);
  }
  function legacyCopy(t, cb){
    var ta = document.createElement('textarea');
    ta.value = t;
    ta.style.position = 'fixed'; ta.style.opacity = '0';
    document.body.appendChild(ta); ta.focus(); ta.select();
    var ok = false;
    try { ok = document.execCommand('copy'); } catch(e) {}
    document.body.removeChild(ta);
    if (ok && cb) cb();
  }

  // chip copy
  var chip = document.getElementById('nick');
  var chipHTML = chip.innerHTML, copyTimer = null;
  function onCopied(){
    chip.classList.remove('rippling'); void chip.offsetWidth;
    chip.classList.add('copied', 'rippling'); chip.textContent = I18N[lang].copied;
    if (navigator.vibrate) navigator.vibrate(30);
    clearTimeout(copyTimer);
    copyTimer = setTimeout(function(){
      chip.classList.remove('copied', 'rippling');
      chip.innerHTML = chipHTML;
    }, 1300);
  }
  chip.addEventListener('click', function(){ copyText(chip.dataset.copy, onCopied); });
  chip.addEventListener('contextmenu', function(e){ e.preventDefault(); copyText(chip.dataset.copy, onCopied); });

  // QR modal
  var modal = document.getElementById('qr');
  document.getElementById('tgbtn').addEventListener('click', function(e){
    e.preventDefault();
    modal.classList.add('show'); modal.setAttribute('aria-hidden','false');
  });
  function closeQr(){ modal.classList.remove('show'); modal.setAttribute('aria-hidden','true'); }
  modal.addEventListener('click', function(e){ if (e.target === modal) closeQr(); });
  document.getElementById('qrclose').addEventListener('click', closeQr);
  document.addEventListener('keydown', function(e){ if (e.key === 'Escape') closeQr(); });

  // snow (dark theme only, toggle below theme button)
  var snowCanvas = document.createElement('canvas');
  snowCanvas.id = 'snow';
  document.body.appendChild(snowCanvas);
  var sctx = snowCanvas.getContext('2d');
  var flakes = [], snowOn = true, snowRunning = false, snowRAF = 0, snowAlpha = 0, snowTarget = 0;
  function snowSize(){ snowCanvas.width = window.innerWidth; snowCanvas.height = window.innerHeight; }
  window.addEventListener('resize', function(){ if (snowRunning) snowSize(); });
  function makeFlakes(){
    flakes = [];
    var n = Math.min(90, Math.floor(window.innerWidth / 12));
    for (var i = 0; i < n; i++) flakes.push({
      x: Math.random() * window.innerWidth,
      y: Math.random() * window.innerHeight,
      r: 0.8 + Math.random() * 2.6,
      s: 0.4 + Math.random() * 1.1,
      d: (Math.random() - 0.5) * 0.6,
      o: 0.25 + Math.random() * 0.6,
      ph: Math.random() * 6.283
    });
  }
  function tickSnow(t){
    snowAlpha += (snowTarget - snowAlpha) * 0.035;
    if (snowTarget === 0 && snowAlpha < 0.02){
      snowAlpha = 0; snowRunning = false;
      sctx.clearRect(0, 0, snowCanvas.width, snowCanvas.height);
      return;
    }
    sctx.clearRect(0, 0, snowCanvas.width, snowCanvas.height);
    sctx.fillStyle = '#ffffff';
    for (var i = 0; i < flakes.length; i++){
      var f = flakes[i];
      f.y += f.s;
      f.x += Math.sin(t / 1400 + f.ph) * 0.4 + f.d;
      if (f.y > snowCanvas.height + 6){ f.y = -6; f.x = Math.random() * window.innerWidth; }
      if (f.x < -6) f.x = window.innerWidth + 6; else if (f.x > window.innerWidth + 6) f.x = -6;
      sctx.globalAlpha = f.o * (0.75 + 0.25 * Math.sin(t / 900 + f.ph)) * snowAlpha;
      sctx.beginPath(); sctx.arc(f.x, f.y, f.r, 0, 6.283); sctx.fill();
    }
    sctx.globalAlpha = 1;
    if (snowRunning) snowRAF = requestAnimationFrame(tickSnow);
  }
  function updateSnow(){
    var want = snowOn && document.documentElement.dataset.theme !== 'light';
    snowTarget = want ? 1 : 0;
    if ((snowTarget === 1 || snowAlpha > 0.01) && !snowRunning){
      snowRunning = true; snowSize(); makeFlakes();
      snowRAF = requestAnimationFrame(tickSnow);
    }
  }
  try { snowOn = localStorage.getItem('shq-snow') !== 'off'; } catch(e) {}
  var sbtn = document.getElementById('sbtn');
  function snowBtnUI(){ sbtn.classList.toggle('on', snowOn); }
  sbtn.addEventListener('click', function(){
    snowOn = !snowOn;
    try { localStorage.setItem('shq-snow', snowOn ? 'on' : 'off'); } catch(e) {}
    snowBtnUI(); updateSnow(); updateGarland();
  });
  snowBtnUI();
  document.addEventListener('visibilitychange', function(){
    if (snowRunning && !document.hidden){ cancelAnimationFrame(snowRAF); snowRAF = requestAnimationFrame(tickSnow); }
  });
  updateSnow();

  // garland: swag cable (SVG) + swaying twinkling bulbs
  var gl = document.getElementById('garland');
  function updateGarland(){
    if (gl) gl.style.opacity = snowOn ? '1' : '0';
    var nyd = document.getElementById('nyd');
    if (nyd) nyd.style.opacity = snowOn ? '1' : '0';
  }
  if (gl) {
    var GCOLORS = ['#ff5f6d','#ffc24b','#5ee07f','#57c7ff','#b78bff','#ff8ac2'];
    var GW = Math.max(340, window.innerWidth);
    var GH = 60, SAG = 22, ATT = 4;
    var swags = Math.max(2, Math.round(GW / 320));
    var swagW = GW / swags;
    var svgNS = 'http://www.w3.org/2000/svg';
    var wire = document.createElementNS(svgNS, 'svg');
    wire.setAttribute('viewBox', '0 0 ' + GW + ' ' + GH);
    wire.setAttribute('preserveAspectRatio', 'none');
    var d = '';
    for (var s = 0; s < swags; s++) {
      var x0 = s * swagW, x1 = (s + 1) * swagW;
      d += (s ? 'L' : 'M') + x0 + ' ' + ATT +
           ' Q ' + ((x0 + x1) / 2) + ' ' + (ATT + SAG * 2) + ' ' + x1 + ' ' + ATT;
    }
    var path = document.createElementNS(svgNS, 'path');
    path.setAttribute('d', d);
    path.setAttribute('fill', 'none');
    path.setAttribute('stroke', 'rgba(255,255,255,.16)');
    path.setAttribute('stroke-width', '2');
    path.setAttribute('stroke-linecap', 'round');
    wire.appendChild(path);
    gl.appendChild(wire);
    for (var sw = 0; sw < swags; sw++) {
      var per = Math.max(4, Math.round(swagW / 72));
      for (var bi = 0; bi <= per; bi++) {
        var u = bi / per;
        var bx = sw * swagW + u * swagW;
        var by = ATT + SAG * 4 * u * (1 - u); // dips along the cable
        var bulb = document.createElement('i');
        bulb.className = 'bulb';
        bulb.style.left = (bx - 6) + 'px';
        bulb.style.top = by + 'px';
        bulb.style.setProperty('--c', GCOLORS[(sw * 3 + bi) % GCOLORS.length]);
        bulb.style.setProperty('--td', (2.1 + Math.random() * 1.7).toFixed(2) + 's');
        bulb.style.setProperty('--sd', (2.8 + Math.random() * 1.9).toFixed(2) + 's');
        bulb.style.setProperty('--bd', (-(Math.random() * 4)).toFixed(2) + 's');
        var cap = document.createElement('span');
        cap.className = 'cap';
        var glass = document.createElement('span');
        glass.className = 'glass';
        bulb.appendChild(cap);
        bulb.appendChild(glass);
        gl.appendChild(bulb);
      }
    }
    updateGarland();
  }

  // countdown to New Year (footer is below this script, wait for DOM)
  function pad2(x){ return (x < 10 ? '0' : '') + x; }
  function initNY(){
    var nyd = document.getElementById('nyd');
    if (!nyd) return;
    function tickNY(){
      var now = new Date();
      var diff = new Date(now.getFullYear() + 1, 0, 1) - now;
      var d = Math.floor(diff / 86400000);
      nyd.textContent = 'до Нового года: ' + (d > 0 ? d + 'д ' : '') +
        pad2(Math.floor(diff / 3600000) % 24) + ':' +
        pad2(Math.floor(diff / 60000) % 60) + ':' +
        pad2(Math.floor(diff / 1000) % 60);
    }
    tickNY();
    setInterval(tickNY, 1000);
  }
  if (document.readyState === 'loading') document.addEventListener('DOMContentLoaded', initNY);
  else initNY();

  // shooting stars (tied to the snow toggle)
  var meteorCanvas = document.createElement('canvas');
  meteorCanvas.id = 'meteor';
  document.body.appendChild(meteorCanvas);
  var mctx = meteorCanvas.getContext('2d');
  meteorCanvas.style.cssText = 'position:fixed;inset:0;z-index:0;pointer-events:none';
  var meteors = [], meteorRAF = 0, meteorLimited = window.matchMedia('(prefers-reduced-motion: reduce)').matches;
  function meteorSize(){ meteorCanvas.width = window.innerWidth; meteorCanvas.height = window.innerHeight; }
  meteorSize();
  window.addEventListener('resize', meteorSize);
  function spawnMeteor(){
    if (!snowOn || document.hidden || meteorLimited) return;
    var ang = Math.PI * (0.20 + Math.random() * 0.22); // вниз-вправо
    var sp = 7 + Math.random() * 5;
    meteors.push({ x: Math.random() * window.innerWidth, y: -20,
      vx: Math.cos(ang) * sp, vy: Math.sin(ang) * sp,
      life: 1, len: 90 + Math.random() * 90 });
    if (meteorRAF === 0) meteorRAF = requestAnimationFrame(tickMeteors);
  }
  function tickMeteors(){
    mctx.clearRect(0, 0, meteorCanvas.width, meteorCanvas.height);
    meteors = meteors.filter(function(m){
      m.x += m.vx; m.y += m.vy; m.life -= 0.018;
      if (m.life <= 0 || m.y > meteorCanvas.height + 60) return false;
      var norm = m.len / Math.hypot(m.vx, m.vy);
      var x2 = m.x - m.vx * norm, y2 = m.y - m.vy * norm;
      var g = mctx.createLinearGradient(m.x, m.y, x2, y2);
      g.addColorStop(0, 'rgba(255,255,255,' + (0.9 * m.life).toFixed(3) + ')');
      g.addColorStop(1, 'rgba(160,200,255,0)');
      mctx.strokeStyle = g; mctx.lineWidth = 2.2; mctx.lineCap = 'round';
      mctx.beginPath(); mctx.moveTo(m.x, m.y); mctx.lineTo(x2, y2); mctx.stroke();
      mctx.fillStyle = 'rgba(255,255,240,' + (0.95 * m.life).toFixed(3) + ')';
      mctx.beginPath(); mctx.arc(m.x, m.y, 2, 0, 6.283); mctx.fill();
      return true;
    });
    meteorRAF = meteors.length ? requestAnimationFrame(tickMeteors) : 0;
  }
  setInterval(function(){
    if (Math.random() < 0.55) spawnMeteor();
  }, 5200);

  // confetti easter egg: клик по аватару
  var confCanvas = document.createElement('canvas');
  confCanvas.id = 'confetti';
  document.body.appendChild(confCanvas);
  var cctx = confCanvas.getContext('2d');
  confCanvas.style.cssText = 'position:fixed;inset:0;z-index:60;pointer-events:none';
  function confSize(){ confCanvas.width = window.innerWidth; confCanvas.height = window.innerHeight; }
  confSize();
  window.addEventListener('resize', confSize);
  var confs = [], confRAF = 0;
  function tickConf(){
    cctx.clearRect(0, 0, confCanvas.width, confCanvas.height);
    confs = confs.filter(function(p){
      p.vy += 0.16; p.x += p.vx; p.y += p.vy; p.rot += p.vr; p.life -= 0.011;
      if (p.life <= 0 || p.y > confCanvas.height + 20) return false;
      cctx.save();
      cctx.translate(p.x, p.y); cctx.rotate(p.rot);
      cctx.globalAlpha = Math.max(0, Math.min(1, p.life * 1.7));
      cctx.fillStyle = p.col;
      cctx.fillRect(-p.s / 2, -p.s / 3, p.s, p.s * 0.66);
      cctx.restore();
      return true;
    });
    if (confs.length) confRAF = requestAnimationFrame(tickConf);
    else { confRAF = 0; cctx.clearRect(0, 0, confCanvas.width, confCanvas.height); }
  }
  function confetti(x, y){
    var cols = ['#ff5ea8','#ff9e57','#57c7ff','#b06bff','#ffe14d','#7ef29c'];
    for (var i = 0; i < 110; i++){
      var ang = Math.random() * 6.283, sp = 2 + Math.random() * 7;
      confs.push({ x: x, y: y, vx: Math.cos(ang) * sp, vy: Math.sin(ang) * sp - 3.2,
        s: 5 + Math.random() * 7, rot: Math.random() * 6.283, vr: (Math.random() - 0.5) * 0.32,
        col: cols[i % cols.length], life: 1 });
    }
    if (confRAF === 0) confRAF = requestAnimationFrame(tickConf);
  }
  document.querySelector('.ava').addEventListener('click', function(){
    if (!snowOn) return;
    var r = this.getBoundingClientRect();
    confetti(r.left + r.width / 2, r.top + r.height / 2);
    if (navigator.vibrate) navigator.vibrate(15);
  });

})();
</script>

  <div id="nyd"></div>
  <div style="opacity:0.5;">© 2026 SecretSharkQ. Все права защищены.</div>
</footer>
