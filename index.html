<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>шеф — визитка</title>
<meta name="description" content="Личная визитка · @secretsharkq">
<link rel="icon" href="https://unavatar.io/telegram/secretsharkq">
<link rel="preconnect" href="https://unavatar.io" crossorigin>
<style>
:root{--bg:#0b1420;--card:#121e2b;--line:#1f2f3f;--tx:#eaf2f8;--mut:#7f95a6;--ac:#2aabee;--ac2:#229ed9}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%}
body{background:radial-gradient(1200px 700px at 50% -10%,#16283c 0%,var(--bg) 55%) no-repeat fixed;background-color:var(--bg);color:var(--tx);font-family:'Segoe UI',system-ui,-apple-system,sans-serif;line-height:1.5;-webkit-font-smoothing:antialiased;display:flex;align-items:center;justify-content:center;padding:28px 16px}
.card{width:100%;max-width:360px;text-align:center}
.ava{width:112px;height:112px;border-radius:50%;margin:0 auto 18px;display:block;padding:3px;background:conic-gradient(from 210deg,var(--ac),#517da2,var(--ac));box-shadow:0 0 34px rgba(42,171,238,.25)}
.ava img{width:100%;height:100%;border-radius:50%;display:block;object-fit:cover;background:#1c2937}
h1{font-size:26px;font-weight:600;letter-spacing:.2px}
.user{display:inline-flex;align-items:center;gap:6px;margin:8px auto 26px;padding:5px 14px;border:1px solid var(--line);border-radius:999px;background:rgba(255,255,255,.03);color:var(--ac);text-decoration:none;font-size:14px}
.user:hover{background:rgba(42,171,238,.08)}
.links{display:flex;flex-direction:column;gap:11px}
.btn{display:flex;align-items:center;gap:13px;padding:14px 18px;border-radius:14px;background:var(--card);border:1px solid var(--line);color:var(--tx);text-decoration:none;font-size:15px;font-weight:500;transition:transform .12s ease,background .12s ease}
.btn:hover{transform:translateY(-1px);background:#162434}
.btn .ic{width:38px;height:38px;border-radius:11px;display:flex;align-items:center;justify-content:center;flex:none;font-size:17px}
.btn small{display:block;color:var(--mut);font-size:12px;font-weight:400;margin-top:1px}
.ic-tg{background:linear-gradient(135deg,#2aabee,#1c86c6)}
.ic-gh{background:#24292f}
.ic-bot{background:linear-gradient(135deg,#8957e5,#6f3fd4)}
.btn .arrow{margin-left:auto;color:var(--mut)}
.foot{margin-top:26px;color:var(--mut);font-size:12px}
.foot a{color:var(--mut)}
@media(max-width:380px){.ava{width:96px;height:96px}h1{font-size:23px}}
</style>
</head>
<body>
<main class="card">
  <div class="ava"><img src="https://unavatar.io/telegram/secretsharkq" alt="Аватар из Telegram" referrerpolicy="no-referrer"></div>
  <h1>шеф</h1>
  <a class="user" href="https://t.me/secretsharkq" target="_blank" rel="noopener">@secretsharkq</a>

  <nav class="links">
    <a class="btn" href="https://t.me/secretsharkq" target="_blank" rel="noopener">
      <span class="ic ic-tg">✈</span>
      <span>Telegram<small>написать в личку</small></span>
      <span class="arrow">→</span>
    </a>
    <a class="btn" href="https://github.com/SecretSharkQ" target="_blank" rel="noopener">
      <span class="ic ic-gh">⌥</span>
      <span>GitHub<small>код и проекты</small></span>
      <span class="arrow">→</span>
    </a>
    <a class="btn" href="https://t.me/Wasteland_Shelter_Bot" target="_blank" rel="noopener">
      <span class="ic ic-bot">🤖</span>
      <span>Wasteland Shelter<small>мой бот</small></span>
      <span class="arrow">→</span>
    </a>
  </nav>

  <div class="foot">sharkq.loc.cc · © 2026</div>
</main>
</body>
</html>
