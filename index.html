<style>
:root{--bg:#000000;--glow:#1b1b1d;--card:#0d0d0f;--line:#2c2c2e;--tx:#f5f5f7;--mut:#86868b;--ac:#2997ff;--hover:#1a1a1c;--chipbg:rgba(255,255,255,.06);--btnr:999px;--ring:linear-gradient(135deg,#f5f5f7,#48484a);--ringglow:rgba(255,255,255,.25);--shade:rgba(0,0,0,.7)}
html[data-theme=light]{--bg:#f5f5f7;--glow:#e8e8ed;--card:#ffffff;--line:#d2d2d7;--tx:#1d1d1f;--mut:#6e6e73;--ac:#0071e3;--hover:#eeeef0;--chipbg:rgba(0,0,0,.04);--btnr:999px;--ring:linear-gradient(135deg,#0071e3,#42a5f5);--ringglow:rgba(0,113,227,.2);--shade:rgba(0,0,0,.35)}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%}
body{background:radial-gradient(1200px 700px at 50% -10%,var(--glow) 0%,var(--bg) 55%) no-repeat fixed;background-color:var(--bg);color:var(--tx);font-family:'Segoe UI',system-ui,-apple-system,sans-serif;line-height:1.5;-webkit-font-smoothing:antialiased;display:flex;align-items:center;justify-content:center;padding:28px 16px;transition:background-color .3s,color .3s}
.card{width:100%;max-width:360px;text-align:center;position:relative;animation:rise .55s ease-out both}
@keyframes rise{from{opacity:0;transform:translateY(16px)}to{opacity:1;transform:none}}
@media(prefers-reduced-motion:reduce){.card{animation:none}}
.themebtn{position:absolute;top:-4px;right:-4px;width:40px;height:40px;border-radius:50%;border:1px solid var(--line);background:var(--card);color:var(--mut);cursor:pointer;display:flex;align-items:center;justify-content:center}
.themebtn svg{display:block}
.langbtn{position:absolute;top:-4px;right:44px;height:40px;min-width:40px;padding:0 12px;border-radius:20px;border:1px solid var(--line);background:var(--card);color:var(--mut);cursor:pointer;font-size:12px;font-weight:500;font-family:'Consolas',monospace}
.langbtn:hover,.themebtn:hover{color:var(--tx)}
html .themebtn .sun{display:block}
html .themebtn .moon{display:none}
html[data-theme=light] .themebtn .sun{display:none}
html[data-theme=light] .themebtn .moon{display:block}
.ava{width:112px;height:112px;border-radius:50%;margin:0 auto 18px;display:block;padding:3px;background:var(--ring);box-shadow:0 0 34px var(--ringglow)}
.ava img{width:100%;height:100%;border-radius:50%;display:block;object-fit:cover;background:#1c2937}
h1{font-size:26px;font-weight:600;letter-spacing:.2px}
.user{display:inline-flex;align-items:center;gap:6px;margin:8px auto 26px;padding:5px 14px;border:1px solid var(--line);border-radius:999px;background:var(--chipbg);color:var(--ac);text-decoration:none;font-size:14px;user-select:none;-webkit-user-select:none;cursor:pointer;transition:background .2s}
.user:hover{background:rgba(42,171,238,.08)}
.user.copied{background:var(--ac);border-color:var(--ac);color:#fff}
.links{display:flex;flex-direction:column;gap:11px}
.btn{display:flex;align-items:center;gap:13px;padding:14px 18px;border-radius:var(--btnr);background:var(--card);border:1px solid var(--line);color:var(--tx);text-decoration:none;font-size:15px;font-weight:500;transition:transform .12s ease,box-shadow .12s ease}
.btn:hover{transform:translateY(-1px)}
.btn.tg{background:linear-gradient(135deg,#2aabee,#1c86c6);border-color:rgba(42,171,238,.4)}
.btn.tg:hover{box-shadow:0 8px 26px rgba(42,171,238,.35)}
.btn.gh{background:linear-gradient(135deg,#24292f,#0d1117);border-color:#30363d}
.btn.gh:hover{box-shadow:0 8px 26px rgba(36,41,47,.6)}
.btn .ic{width:38px;height:38px;border-radius:11px;display:flex;align-items:center;justify-content:center;flex:none;color:#fff}
.btn .ic svg{display:block}
.btn small{display:block;color:var(--mut);font-size:12px;font-weight:400;margin-top:1px}
.btn.tg small,.btn.gh small{color:rgba(255,255,255,.72)}
.ic-tg{background:rgba(255,255,255,.16)}
.ic-gh{background:rgba(255,255,255,.14)}
.btn .arrow{margin-left:auto;color:var(--mut)}
.modal{position:fixed;inset:0;background:rgba(5,12,20,.55);display:flex;align-items:center;justify-content:center;padding:20px;opacity:0;pointer-events:none;transition:opacity .2s;z-index:10}
.modal.show{opacity:1;pointer-events:auto}
.sheet{background:var(--card);border:1px solid var(--line);border-radius:20px;padding:22px;max-width:300px;width:100%;text-align:center;transform:scale(.94);transition:transform .2s}
.modal.show .sheet{transform:scale(1)}
.sheet b{font-size:16px}
.qrbox{background:#fff;border-radius:14px;padding:14px;margin:14px auto;width:200px}
.qrbox svg{display:block;width:100%;height:auto;shape-rendering:crispEdges}
.qrhint{color:var(--ac);font-size:14px;margin-bottom:14px}
.qr-go{display:block;background:linear-gradient(135deg,#2aabee,#1c86c6);color:#fff;text-decoration:none;font-weight:600;padding:12px;border-radius:var(--btnr);font-size:15px}
.qr-x{background:none;border:none;color:var(--mut);font-size:13px;padding:10px 6px 0;cursor:pointer;font-family:inherit}
.qr-x:hover{color:var(--tx)}
.foot{margin-top:26px;color:var(--mut);font-size:12px;font-family:'Consolas','Courier New',monospace;min-height:18px;letter-spacing:.5px}
.foot .dud{opacity:.4}
@media(max-width:380px){.ava{width:96px;height:96px}h1{font-size:23px}.langbtn{right:38px;padding:0 8px}}
</style>

<script>
(function(){
  var I18N = {
    ru: {tg:'Написать в личку', 'tg-s':'QR или сразу переход', 'gh-s':'код и проекты', scan:'Сканируй или жми', go:'Перейти в Telegram', close:'Закрыть', copied:'скопировано ✓'},
    en: {tg:'Message me', 'tg-s':'QR or direct link', 'gh-s':'code & projects', scan:'Scan or tap', go:'Open Telegram', close:'Close', copied:'copied ✓'}
  };
  var lang = 'ru';
  try { lang = localStorage.getItem('shq-lang') || 'ru'; } catch(e) {}

  // clean junk hash from url
  if (location.hash) { try { history.replaceState(null, '', location.pathname + location.search); } catch(e) {} }

  // dynamic telegram name (like avatar)
  var pname = document.getElementById('pname');
  try { var cn = localStorage.getItem('shq-name'); if (cn) pname.textContent = cn; } catch(e) {}
  var proxies = [
    'https://api.allorigins.win/raw?url=' + encodeURIComponent('https://t.me/secretsharkq'),
    'https://corsproxy.io/?url=' + encodeURIComponent('https://t.me/secretsharkq')
  ];
  (function pull(i){
    if (i >= proxies.length) return;
    fetch(proxies[i]).then(function(r){ return r.text(); }).then(function(html){
      var m = html.match(/<meta property="og:title" content="([^"]*)"/);
      var nm = m && m[1] ? m[1].trim() : '';
      if (nm && nm.indexOf('Telegram') !== 0) {
        pname.textContent = nm;
        try { localStorage.setItem('shq-name', nm); } catch(e) {}
      }
    }).catch(function(){ pull(i + 1); });
  })(0);

  // theme
  var tb = document.getElementById('tbtn');
  tb.addEventListener('click', function(){
    var d = document.documentElement;
    var toLight = d.dataset.theme !== 'light';
    d.dataset.theme = toLight ? 'light' : 'dark';
    try { localStorage.setItem('shq-theme', toLight ? 'light' : 'dark'); } catch(e) {}
  });

  // language
  var lb = document.getElementById('langbtn');
  function applyLang(){
    var els = document.querySelectorAll('[data-i18n]');
    for (var i = 0; i < els.length; i++) {
      var k = els[i].dataset.i18n;
      if (I18N[lang][k]) els[i].textContent = I18N[lang][k];
    }
    document.documentElement.lang = lang;
    lb.textContent = (lang === 'ru') ? 'EN' : 'RU';
  }
  lb.addEventListener('click', function(){
    lang = (lang === 'ru') ? 'en' : 'ru';
    try { localStorage.setItem('shq-lang', lang); } catch(e) {}
    applyLang();
  });
  applyLang();

  // click to copy (with http fallback)
  var chip = document.getElementById('nick'), orig = null;
  function onCopied(){
    if (!orig) orig = chip.innerHTML;
    chip.classList.add('copied'); chip.textContent = I18N[lang].copied;
    if (navigator.vibrate) navigator.vibrate(30);
    setTimeout(function(){ chip.classList.remove('copied'); chip.innerHTML = orig; orig = null; }, 1300);
  }
  function legacyCopy(t){
    var ta = document.createElement('textarea');
    ta.value = t;
    ta.style.position = 'fixed'; ta.style.opacity = '0';
    document.body.appendChild(ta); ta.focus(); ta.select();
    var ok = false;
    try { ok = document.execCommand('copy'); } catch(e) {}
    document.body.removeChild(ta);
    if (ok) onCopied();
  }
  function doCopy(){
    var t = chip.dataset.copy;
    if (navigator.clipboard && window.isSecureContext) {
      navigator.clipboard.writeText(t).then(onCopied, function(){ legacyCopy(t); });
    } else legacyCopy(t);
  }
  chip.addEventListener('click', doCopy);
  chip.addEventListener('contextmenu', function(e){ e.preventDefault(); doCopy(); });

  // QR modal
  var modal = document.getElementById('qr');
  document.getElementById('tgbtn').addEventListener('click', function(e){
    e.preventDefault();
    modal.classList.add('show'); modal.setAttribute('aria-hidden','false');
  });
  function closeQr(){ modal.classList.remove('show'); modal.setAttribute('aria-hidden','true'); }
  modal.addEventListener('click', function(e){ if (e.target === modal) closeQr(); });
  document.getElementById('qrclose').addEventListener('click', closeQr);
  document.addEventListener('keydown', function(e){ if (e.key === 'Escape') closeQr(); });

})();
</script>
