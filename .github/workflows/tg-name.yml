name: Sync Telegram name

on:
  schedule:
    - cron: '*/5 * * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:

  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Fetch current name from t.me
        run: |
          NAME=$(curl -s https://t.me/secretsharkq | grep -oP '(?<=<meta property="og:title" content=")[^"]*' | head -1 || true)
          if [ -z "$NAME" ] || [[ "$NAME" == Telegram* ]]; then
            NAME=$(python3 -c "import json;print(json.load(open('name.json'))['name'])" 2>/dev/null || echo "шеф")
          fi
          printf '{"name": "%s"}\n' "$(printf '%s' "$NAME" | sed 's/"/\\"/g')" > name.json

      - name: Commit if changed
        run: |
          git config user.name "tg-sync-bot"
          git config user.email "tg-sync-bot@users.noreply.github.com"
          git add name.json
          if ! git diff --cached --quiet; then
            git commit -m "sync: telegram name"
            git push
          fi

      - name: Push name.json + index.html to Netlify
        env:
          NLT: ${{ secrets.NLT }}
        run: |
          SITE_ID="c8166aa3-ade8-4e51-adc5-15e0f5f7817e"
          D1=$(sha1sum name.json | cut -d' ' -f1)
          D2=$(sha1sum index.html | cut -d' ' -f1)
          DID=$(curl -s -X POST -H "Authorization: Bearer $NLT" -H 'Content-Type: application/json' \
            -d "{\"files\": {\"/name.json\": \"$D1\", \"/index.html\": \"$D2\"}}" \
            "https://api.netlify.com/api/v1/sites/$SITE_ID/deploys" | python3 -c "import json,sys;print(json.load(sys.stdin)['id'])")
          curl -s -X PUT -H "Authorization: Bearer $NLT" -H 'Content-Type: application/octet-stream' \
            --data-binary @name.json \
            "https://api.netlify.com/api/v1/deploys/$DID/files/name.json"
          curl -s -X PUT -H "Authorization: Bearer $NLT" -H 'Content-Type: application/octet-stream' \
            --data-binary @index.html \
            "https://api.netlify.com/api/v1/deploys/$DID/files/index.html"
